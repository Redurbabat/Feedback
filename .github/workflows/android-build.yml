name: Android Build

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Bewusst eine Repository-Variable und kein Secret. Der Hostname ist nicht geheim - er steht
      # im Manifest der gebauten APK und in der assetlinks.json des Servers. Er gehoert aber
      # trotzdem nicht ins Repository, weil er zur Installation des Besitzers gehoert und nicht zum
      # Quelltext. Hier steht er vor allem deshalb, damit ein ungueltiger Wert im Pull Request
      # auffaellt und nicht erst beim Veroeffentlichen: der Build bricht dann mit einer klaren
      # Meldung ab.
      FEEDBACK_SERVER_URL: ${{ vars.FEEDBACK_SERVER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # packages: "" schaltet die Standardinstallation der Action ab. Sie verlangt sonst das
      # Paket "tools", das Google seit Langem abgekuendigt hat und inzwischen nicht mehr
      # ausliefert - sdkmanager bricht dann mit "Failed to find package 'tools'" ab, und zwar
      # unabhaengig davon, was im Quelltext steht. Was dieser Build wirklich braucht, steht
      # ohnehin im naechsten Schritt, und zwar an genau einer Stelle.
      - name: Set up current Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          packages: ""

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        working-directory: android
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      # Auch der Release-Build laeuft hier, obwohl er hier nichts veroeffentlicht: das ist der
      # Build, der als APK herausgeht, und ein Fehler darin darf nicht erst beim
      # Veroeffentlichen auffallen.
      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace

      - name: Pruefen, dass die Release-APK nicht debuggable ist
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT="$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 | tail -n 1)"
          # Eine debuggable APK laesst jeden mit ADB-Zugang ueber `run-as` das private
          # Datenverzeichnis lesen - ohne Root und ohne die App-Sperre zu kennen.
          if "$AAPT" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "FEHLER: die Release-APK ist debuggable."
            exit 1
          fi
          echo "Release-APK ist nicht debuggable."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: feedback-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-android-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
