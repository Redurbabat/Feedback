# Laeuft, sobald server/ existiert. Der Pfadfilter nennt bewusst NUR
# server/**: sonst wuerde bereits das Anlegen dieser Workflow-Datei einen
# Lauf gegen eine noch nicht vorhandene Komponente ausloesen. Sobald
# server/ steht, wird '.github/workflows/server-ci.yml' wieder mit aufgenommen,
# damit auch Aenderungen am Workflow selbst geprueft werden.
name: Server CI

on:
  push:
    paths:
      - "server/**"
  pull_request:
    paths:
      - "server/**"

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
